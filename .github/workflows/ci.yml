name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared by every job that boots Django. Tests import settings with DEBUG=True (as local
  # development does) so SSL redirects and secure cookies do not break the test client; Django's
  # test runner still runs each test with settings.DEBUG=False, and the deploy-check step below
  # verifies the real production configuration.
  DEBUG: "True"
  ALLOWED_HOSTS: testserver,localhost,127.0.0.1
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/zencraft_db

jobs:
  lint-and-audit:
    name: Lint, security scan and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (includes the bandit security rules, select = S)
        run: ruff check .

      - name: Bandit
        run: bandit -r apps config scripts -ll

      - name: pip-audit (runtime and dev dependencies)
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests (Python ${{ matrix.python-version }}, PostgreSQL 16)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    services:
      # Real PostgreSQL: the app relies on django.contrib.postgres full-text search and row locking.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zencraft_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate a throwaway SECRET_KEY
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV"

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Deployment checklist (DEBUG=False, production-shaped environment)
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: zencraftsolution.com
          # The zencraft.E00x checks refuse a deployment that would lose media, swallow email or
          # share one lockout counter, so the check needs a production-shaped environment.
          SITE_URL: https://zencraftsolution.com
          CLOUDINARY_CLOUD_NAME: ci-placeholder
          CLOUDINARY_API_KEY: ci-placeholder
          CLOUDINARY_API_SECRET: ci-placeholder
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          PRIVATE_MEDIA_PERSISTENT: "True"
        # The same order as the Render build: production uses the database cache, and the deploy
        # check writes a probe to it (zencraft.E009), so its table must exist first. It is created
        # here, with this step's production settings, because under DEBUG=True the cache is
        # in-memory and createcachetable would quietly do nothing.
        run: |
          python manage.py createcachetable
          python manage.py check --deploy --fail-level WARNING

      # This job installs no browser. apps/core/conftest.py refuses a run in which a test that is
      # not marked e2e would need one (it asks for page, context or browser), so collecting the
      # "not e2e" selection is enough to fail here, by name, before anything runs.
      - name: No test outside the browser job needs a browser
        run: python -m pytest -m "not e2e" --collect-only -q

      - name: Test suite with coverage (everything except the browser tests)
        env:
          # Belt and braces: a browser launch that slipped past the check above finds no browser
          # here and fails at once, rather than this job quietly starting to need one.
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/no-browsers-in-this-job
        run: python -m pytest -m "not e2e" --cov --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Coverage floors (85% per app, 90% branch on money and access code)
        run: python scripts/check_coverage.py --floor 85 --branch-floor 90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  browser:
    name: Browser, accessibility and layout
    runs-on: ubuntu-latest
    # These are slow and need a browser, so they run once rather than across the matrix.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zencraft_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt

      # Browsers are ~300 MB; downloading them on every run is most of this job's time.
      - name: Cache the Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Generate a throwaway SECRET_KEY
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV"

      - name: Journeys, accessibility and layout
        run: python -m pytest -m e2e --tracing=retain-on-failure

      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: |
            test-results/
            /tmp/pytest-of-runner/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  seo:
    name: SEO crawl
    runs-on: ubuntu-latest
    # These two modules also run inside the test job. Repeating them here costs two minutes and
    # buys a check named "SEO crawl" that is red or green on its own, which is what you want to
    # look at after changing a template.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zencraft_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate a throwaway SECRET_KEY
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV"

      # Walks every URL in the sitemap: one h1, no skipped heading levels, title and description
      # within the length a search result shows and unique across the site, alt text and
      # dimensions on every image, an absolute canonical, and valid structured data.
      - name: Crawl every page in the sitemap
        run: python -m pytest apps/core/test_seo.py apps/core/test_security_headers.py -v
