{% extends "base.html" %}
{% block cta_band %}{% endblock %}
{% block content %}
<section class="page-hero blueprint">
  <div class="container" style="padding-block:clamp(40px,6vw,72px)">
    <ol class="crumbs" aria-label="Breadcrumb"><li><a href="{% url 'core:home' %}">Home</a></li><li>Legal</li></ol>
    <h1 class="h1 mt-2" data-split>{% block legal_title %}{% endblock %}</h1>
    <p class="mono muted mt-2" data-hero-item style="font-size:.85rem">Last updated 1 September 2026</p>
    <ul class="chips mt-3" data-hero-item>
      <li><a class="chip {% if page == 'privacy' %}is-active{% endif %}" href="{% url 'core:privacy' %}">Privacy policy</a></li>
      <li><a class="chip {% if page == 'terms' %}is-active{% endif %}" href="{% url 'core:terms' %}">Terms of service</a></li>
      <li><a class="chip {% if page == 'cookies' %}is-active{% endif %}" href="{% url 'core:cookies' %}">Cookie policy</a></li>
    </ul>
  </div>
</section>
<section class="section">
  <div class="container container--narrow"><div class="prose">{% block legal_body %}{% endblock %}</div></div>
</section>
{% endblock %}
