<div class="field{% if field.errors %} has-error{% endif %}{% if span %} span-2{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
  <label class="check" for="{{ field.id_for_label }}">{{ field }} <span>{{ field.label }}{% if field.field.required %}<span class="field__req" aria-hidden="true">*</span>{% endif %}</span></label>
  {% else %}
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="field__req" aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="field__help" id="{{ field.id_for_label }}-help">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<ul class="field__error" role="alert">{% for e in field.errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
</div>
