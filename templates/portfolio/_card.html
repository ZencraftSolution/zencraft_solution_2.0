<a class="case-card" style="flex:initial" href="{% url 'portfolio:detail' c.slug %}" data-flip-card>
  <div class="case-card__media"><img src="{{ c.cover_image_url }}" alt="{{ c.title }}" width="960" height="600" loading="lazy" data-seed="{{ c.slug }}" data-flip-img></div>
  <div class="case-card__body">
    <div class="case-card__meta"><span>{{ c.industry.name }}</span><span>{{ c.year }}</span></div>
    <h3>{{ c.title }}</h3>
    <p>{{ c.summary }}</p>
    <div class="case-card__results">
      {% for r in c.results|slice:":2" %}<div><strong>{{ r.value }}</strong><span>{{ r.label }}</span></div>{% endfor %}
    </div>
  </div>
</a>
