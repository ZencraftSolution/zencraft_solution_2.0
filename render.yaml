# Render Blueprint for Zencraft Solution.
#
# Apply it from the Render dashboard: New > Blueprint, point it at this repository.
# Everything marked `sync: false` is a secret you fill in once, in the Render dashboard; those
# values are never committed here. Everything else is set from this file on every deploy.
#
# NAMES MATTER. Render matches resources by name: a service or database named here that already
# exists in the workspace is adopted and reconfigured, and any other name creates a new one.
# The web service is named zencraft_solution so that it adopts the live site. Before applying,
# check that the database name below (zencraft-db) is the name of your existing database in the
# dashboard. If it is not, Render creates a second, EMPTY database and points DATABASE_URL at it.
# See "Deploying to Render" in README.md.
#
# What the build command does, in order and for a reason:
#   collectstatic     - WhiteNoise serves hashed static files; without this the site has no CSS.
#   migrate           - schema and the data migrations that carry content changes.
#   createcachetable  - the default cache is the database cache. Login lockouts and rate limits
#                       live there, so skipping this makes every sign-in error.
#   ensure_superuser  - creates the first admin account from DJANGO_SUPERUSER_*, and does nothing
#                       on later deploys.
#   check --deploy    - last, so a misconfigured deploy fails here and the running version stays
#                       up. ERROR level only: a SITE_URL on localhost (zencraft.E002), no real email
#                       backend, or media that a redeploy would wipe stops it; warnings do not.

databases:
  - name: zencraft-db            # must match your existing database; see NAMES MATTER above
    databaseName: zencraft_db
    user: zencraft
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: zencraft_solution      # the existing service; see NAMES MATTER above
    runtime: python
    plan: starter
    region: singapore          # closest Render region to Nepal
    branch: main
    healthCheckPath: /healthz/
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
      python manage.py createcachetable
      python manage.py ensure_superuser
      python manage.py check --deploy --fail-level ERROR
    # 2 workers x 4 threads suits a starter instance: the work is database and network bound, not
    # CPU bound. The timeout is above the 10s EMAIL_TIMEOUT so a slow mail server loses the send,
    # not the whole request.
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 30 --access-logfile - --error-logfile -
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: zencraft-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false            # zencraftsolution.com,www.zencraftsolution.com,zencraft-solution.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false            # https://zencraftsolution.com,https://www.zencraftsolution.com
      - key: SITE_URL
        sync: false            # https://zencraftsolution.com - used by canonical tags and the sitemap

      # Render terminates TLS and adds exactly one X-Forwarded-For entry. Verify after the first
      # deploy with the procedure in the README; a wrong value shares one lockout across everyone.
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      # Empty means the database cache, which createcachetable prepares above.
      - key: CACHE_URL
        value: ""

      # Public media. Required: the container filesystem is wiped on every deploy.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Private files (CVs, requirement documents). Any S3-compatible bucket; Cloudflare R2 is the
      # cheapest fit. Leave PRIVATE_STORAGE_BACKEND as "local" only if you mount a persistent disk
      # at private_media/ and set PRIVATE_MEDIA_PERSISTENT=True as well.
      - key: PRIVATE_STORAGE_BACKEND
        value: s3
      - key: PRIVATE_S3_BUCKET
        sync: false
      - key: PRIVATE_S3_REGION
        sync: false            # "auto" for Cloudflare R2
      - key: PRIVATE_S3_ENDPOINT_URL
        sync: false            # https://<account>.r2.cloudflarestorage.com for R2; blank for AWS
      - key: PRIVATE_S3_ACCESS_KEY
        sync: false
      - key: PRIVATE_S3_SECRET_KEY
        sync: false

      # Uploads are held on arrival and scanned by the zencraft-scan-uploads cron job below, which
      # streams each file to the zencraft-clamav private service. This service can reach the
      # scanner too, so "strict" (scan inside the upload request) would also work; "quarantine"
      # keeps a slow or restarting scanner off the request path.
      - key: UPLOAD_SCAN_MODE
        value: quarantine
      - key: CLAMAV_HOST
        fromService:
          name: zencraft-clamav
          type: pserv
          property: host
      - key: CLAMAV_PORT
        value: "3310"

      # Email. Without a real backend, order and application confirmations are silently dropped,
      # and a deploy check refuses to start.
      - key: EMAIL_URL
        sync: false            # smtp+tls://apikey:SG.xxxx@smtp.sendgrid.net:587
      - key: DEFAULT_FROM_EMAIL
        sync: false            # Zencraft Solution <hello@zencraftsolution.com>
      - key: INTERNAL_NOTIFY_EMAIL
        sync: false

      # Staff sign-in. Enrol every staff account at HQ > Security BEFORE setting 2FA to True.
      - key: DASHBOARD_PATH
        sync: false            # an obscure prefix of your choosing, e.g. "hq-7x2k/"
      - key: STAFF_2FA_REQUIRED
        value: "False"
      - key: STAFF_SESSION_HOURS
        value: "8"

      # Content-Security-Policy. Deploy once with True, check the reports, then set it to False.
      - key: CSP_REPORT_ONLY
        value: "False"

      - key: LOG_FORMAT
        value: json
      - key: SENTRY_DSN
        sync: false            # optional; leave blank to run without error reporting
      - key: SENTRY_ENVIRONMENT
        value: production

      # Payments. Use the live endpoints and keys once you have them.
      - key: ESEWA_PRODUCT_CODE
        sync: false
      - key: ESEWA_SECRET_KEY
        sync: false
      - key: ESEWA_FORM_URL
        value: https://epay.esewa.com.np/api/epay/main/v2/form
      - key: KHALTI_SECRET_KEY
        sync: false
      - key: KHALTI_API_URL
        value: https://khalti.com/api/v2/
      - key: STRIPE_SECRET_KEY
        sync: false

      # First admin account, used once by ensure_superuser. Change the password after signing in.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  # The virus scanner: the official ClamAV image, running clamd on port 3310 and freshclam for
  # signature updates. A private service has no public URL; only services in this workspace can
  # reach it. It runs on its own because Render's Python runtime cannot install ClamAV.
  # clamd keeps every signature in memory (about 1.2 GB, briefly double while it reloads after an
  # update), so it needs the 2 GB "standard" plan; on 512 MB it is killed while loading. The disk
  # keeps the ~300 MB signature database across restarts, so a restart does not download it again
  # and run into the ClamAV mirrors' rate limits.
  - type: pserv
    name: zencraft-clamav
    runtime: image
    image:
      url: docker.io/clamav/clamav:stable
    plan: standard
    region: singapore
    disk:
      name: clamav-signatures
      mountPath: /var/lib/clamav
      sizeGB: 1

  # Scans the files held by UPLOAD_SCAN_MODE=quarantine and releases the clean ones to the hiring
  # team. Until this runs, an uploaded CV cannot be opened in the dashboard, which is the point.
  # It does not run ClamAV itself: it streams each file to the zencraft-clamav service above.
  - type: cron
    name: zencraft-scan-uploads
    runtime: python
    plan: starter
    region: singapore
    branch: main
    schedule: "*/10 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py scan_quarantined_uploads --retry-errors
    envVars:
      - fromGroup: zencraft-shared
      # Everything Django needs to start and to reach the database, the CV bucket and the scanner.
      # Values entered on the web service are copied from it (envVarKey), so each is still set in
      # one place. Fill them in on the web service before this job first runs.
      - key: DATABASE_URL
        fromDatabase:
          name: zencraft-db
          property: connectionString
      - key: SECRET_KEY
        fromService: {name: zencraft_solution, type: web, envVarKey: SECRET_KEY}
      - key: SITE_URL
        fromService: {name: zencraft_solution, type: web, envVarKey: SITE_URL}
      - key: ALLOWED_HOSTS
        fromService: {name: zencraft_solution, type: web, envVarKey: ALLOWED_HOSTS}
      - key: CACHE_URL
        value: ""              # the database cache, as on the web service
      - key: PRIVATE_STORAGE_BACKEND
        value: s3
      - key: PRIVATE_S3_BUCKET
        fromService: {name: zencraft_solution, type: web, envVarKey: PRIVATE_S3_BUCKET}
      - key: PRIVATE_S3_REGION
        fromService: {name: zencraft_solution, type: web, envVarKey: PRIVATE_S3_REGION}
      - key: PRIVATE_S3_ENDPOINT_URL
        fromService: {name: zencraft_solution, type: web, envVarKey: PRIVATE_S3_ENDPOINT_URL}
      - key: PRIVATE_S3_ACCESS_KEY
        fromService: {name: zencraft_solution, type: web, envVarKey: PRIVATE_S3_ACCESS_KEY}
      - key: PRIVATE_S3_SECRET_KEY
        fromService: {name: zencraft_solution, type: web, envVarKey: PRIVATE_S3_SECRET_KEY}
      - key: CLAMAV_HOST
        fromService:
          name: zencraft-clamav
          type: pserv
          property: host
      - key: CLAMAV_PORT
        value: "3310"
      - key: EMAIL_URL
        fromService: {name: zencraft_solution, type: web, envVarKey: EMAIL_URL}

  # Enforces the retention periods the privacy policy promises: unsuccessful applications after
  # CV_RETENTION_DAYS, inquiries that never became projects after INQUIRY_RETENTION_DAYS. It
  # deletes CVs from the private bucket, so it needs the same storage settings as the scanner.
  - type: cron
    name: zencraft-purge
    runtime: python
    plan: starter
    region: singapore
    branch: main
    schedule: "30 2 * * *"     # 02:30 UTC, which is 08:15 in Kathmandu
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py purge_applications
    envVars:
      - fromGroup: zencraft-shared
      - key: DATABASE_URL
        fromDatabase:
          name: zencraft-db
          property: connectionString
      - key: SECRET_KEY
        fromService: {name: zencraft_solution, type: web, envVarKey: SECRET_KEY}
      - key: SITE_URL
        fromService: {name: zencraft_solution, type: web, envVarKey: SITE_URL}
      - key: ALLOWED_HOSTS
        fromService: {name: zencraft_solution, type: web, envVarKey: ALLOWED_HOSTS}
      - key: CACHE_URL
        value: ""
      - key: PRIVATE_STORAGE_BACKEND
        value: s3
      - key: PRIVATE_S3_BUCKET
        fromService: {name: zencraft_solution, type: web, envVarKey: PRIVATE_S3_BUCKET}
      - key: PRIVATE_S3_REGION
        fromService: {name: zencraft_solution, type: web, envVarKey: PRIVATE_S3_REGION}
      - key: PRIVATE_S3_ENDPOINT_URL
        fromService: {name: zencraft_solution, type: web, envVarKey: PRIVATE_S3_ENDPOINT_URL}
      - key: PRIVATE_S3_ACCESS_KEY
        fromService: {name: zencraft_solution, type: web, envVarKey: PRIVATE_S3_ACCESS_KEY}
      - key: PRIVATE_S3_SECRET_KEY
        fromService: {name: zencraft_solution, type: web, envVarKey: PRIVATE_S3_SECRET_KEY}
      - key: CLAMAV_HOST
        fromService:
          name: zencraft-clamav
          type: pserv
          property: host
      - key: CLAMAV_PORT
        value: "3310"
      - key: EMAIL_URL
        fromService: {name: zencraft_solution, type: web, envVarKey: EMAIL_URL}

# Plain values shared by the cron jobs. Render does not allow an environment group to reference a
# database or a service, or to hold a `sync: false` secret, so DATABASE_URL, SECRET_KEY and the
# other secrets are listed on each cron job above instead, copied from the web service.
envVarGroups:
  - name: zencraft-shared
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"        # the same interpreter as the web service
      - key: DEBUG
        value: "False"
      - key: UPLOAD_SCAN_MODE
        value: quarantine
      - key: LOG_FORMAT
        value: json
