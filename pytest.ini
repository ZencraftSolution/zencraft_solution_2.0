[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py
# Only classes whose name ends in Tests. Without this, pytest tries to collect the Testimonial
# model, because its name happens to start with "Test", and warns that it cannot.
python_classes = *Tests
testpaths = apps
addopts = -p no:cacheprovider --strict-markers
markers =
    e2e: drives a real browser against a live server. Slow; skip with -m "not e2e".
# A new warning fails the run. Anything ignored below is third-party and outside our control;
# everything else, including Django's own removal warnings, has to be dealt with.
filterwarnings =
    error
    ignore::DeprecationWarning:clamd.*
    # Playwright's sync API leaves a task pending when a browser is closed during teardown.
    ignore::DeprecationWarning:playwright.*
    ignore:.*unclosed.*:ResourceWarning
