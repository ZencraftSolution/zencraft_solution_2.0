[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["*/migrations/*", ".claude", "staticfiles", "media", "private_media"]

[tool.ruff.lint]
# pyflakes, the error-class pycodestyle rules, import sorting, bugbear and Django-specific checks
select = ["E4", "E7", "E9", "F", "W", "I", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on attribute access for side effects (e.g. `f.url` raising) and build long fixture literals.
"**/tests.py" = ["B018", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
